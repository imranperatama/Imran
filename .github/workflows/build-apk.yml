name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unzip dan Intip Isi File
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip
        unzip -o GameForge_AI_Imran_MAX_v0_3.zip -d proyek_kamu
        
        echo "=========================================="
        echo "BERIKUT ADALAH ISI UTAMA FILE ZIP KAMU:"
        echo "=========================================="
        ls -la proyek_kamu
        echo "=========================================="

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Coba Build Android Bawaan
      run: |
        cd proyek_kamu
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "ERROR: File gradlew tidak ditemukan. Ini bukan proyek Android Studio!"
          exit 1
        fi

    - name: Upload APK Result
      uses: actions/upload-artifact@v4
      with:
        name: DiaryLayar-Debug-APK
        path: "**/build/outputs/apk/debug/app-debug.apk"
