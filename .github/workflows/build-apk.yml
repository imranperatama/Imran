name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip
        # PERINGATAN: Pastikan file .zip ini memang sudah ada di repositori GitHub Anda!
        unzip -o GameForge_AI_Imran_MAX_v0_3.zip -d .
        ls -la

    - name: Set up JDK 17
      uses: actions/actions-setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Validate & Fix Gradle Wrapper
      run: |
        # Jika gradlew tidak ada, kita generate ulang menggunakan perintah gradle dari setup-gradle
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x gradlew

    - name: Build APK Debug
      run: ./gradlew assembleDebug

    - name: Upload APK Result
      uses: actions/upload-artifact@v4
      with:
        name: DiaryLayar-Debug-APK
        # Pastikan path ini sesuai dengan letak file build Anda
        path: "**/build/outputs/apk/debug/app-debug.apk"
