name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip
        unzip -o GameForge_AI_Imran_MAX_v0_3.zip -d .
        echo "=== STRUKTUR FOLDER SETELAH UNZIP ==="
        ls -la
        echo "=== MENCARI LOKASI BUILD.GRADLE ==="
        find . -name "build.gradle"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK Debug (Auto-Detect Folder)
      run: |
        # Mencari di mana letak file settings.gradle atau build.gradle berada
        GRADLE_DIR=$(dirname $(find . -name "settings.gradle" | head -n 1))
        
        if [ -z "$GRADLE_DIR" ] || [ "$GRADLE_DIR" = "." ]; then
          echo "Menjalankan build di folder utama..."
          if [ ! -f "gradlew" ]; then gradle wrapper --gradle-version 8.7; fi
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Proyek Android ditemukan di folder: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          if [ ! -f "gradlew" ]; then gradle wrapper --gradle-version 8.7; fi
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK Result
      uses: actions/upload-artifact@v4
      with:
        name: DiaryLayar-Debug-APK
        path: "**/build/outputs/apk/debug/app-debug.apk"
